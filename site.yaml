version: 1
source: .build/content
output: public
assets: local
offline: true
site:
  name: Arai Hû
  description: Notes on building practical, open software in Go.
  base_url: https://blog.araihu.com
  repository_url: https://github.com/araihu/blog
  home: index.md
  hide_name: true
  logo: assets/brand/light-transparent-optical.svg
  logo_dark: assets/brand/dark-transparent-optical.svg
  icon: assets/brand/favicon-32.png
  social_image:
    path: assets/brand/social.jpg
    alt: Arai Hû
locales:
  default: en
  supported: [en, pt-BR, es]
  selector:
    enabled: true
    flags:
      en: assets/flags/us.svg
      pt-BR: assets/flags/br.svg
      es: assets/flags/es.svg
publication:
  date_format: 2006-01-02
layout:
  kind: docs
  default: {sidebar: false, toc: false, pagination: false}
navigation:
  links:
    - {label: Articles, href: /blogs/, locale: en}
    - {label: About, href: /about/, locale: en}
    - {label: Artigos, href: /pt-br/blogs/, locale: pt-BR}
    - {label: Sobre, href: /pt-br/about/, locale: pt-BR}
    - {label: Artículos, href: /es/blogs/, locale: es}
    - {label: Acerca de, href: /es/about/, locale: es}
  footer_links:
    - {label: RSS, href: /index.xml, locale: en}
    - {label: RSS, href: /pt-br/index.xml, locale: pt-BR}
    - {label: RSS, href: /es/index.xml, locale: es}
theme:
  builtin: true
  name: modern
  color_mode: system
  allow_switch_theme: true
custom_css:
  - css_url: assets/theme.css
